# Default DBEFNet configuration for prepared CUGUV-style data.
# Paths and splits (override for your prepared layout):
dataset_dir: datasets/CUGUV
train_split: train
val_split: val
# Patch / label interface:
input_shape: 512
label_encoding: "01"   # 01: 0=bg, 1=UV, 255=ignore; or 0255
# DataLoader:
batch_size: 4
num_workers: 4
# Optimization (AdamW + per-batch poly LR):
num_epochs: 100
learning_rate: 0.0001
weight_decay: 0.01
poly_power: 0.9
# Combined loss (focal + dice + CE):
focal_alpha: 0.75
focal_gamma: 2.0
weight_focal: 1.0
weight_dice: 1.0
weight_ce: 1.0
max_grad_norm: 1.0
# Early stopping on validation mIoU:
patience: 50
device: auto
output_dir: outputs/DBEFNet
